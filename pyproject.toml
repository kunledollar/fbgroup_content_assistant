[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-pulse-ai"
version = "0.1.0"
description = "Local community research and Facebook content desktop agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7", "SQLAlchemy>=2.0", "pydantic>=2.7", "pydantic-settings>=2.2",
  "httpx>=0.27", "beautifulsoup4>=4.12", "feedparser>=6.0", "openai>=1.30",
  "python-dateutil>=2.9", "platformdirs>=4.2", "keyring>=25.2", "alembic>=1.13"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-httpx>=0.30", "ruff>=0.5", "pyinstaller>=6.8"]

[project.scripts]
community-pulse = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "S112", "LOG015", "RUF012", "DTZ001", "DTZ003", "DTZ005"]
